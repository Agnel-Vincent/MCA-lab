<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <pattern id="grid-img-05.svg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="grad-img-05.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#202224"/>
      <stop offset="100%" stop-color="#34383D"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="url(#grad-img-05.svg)"/>
  <rect width="1200" height="800" fill="url(#grid-img-05.svg)"/>

  <!-- Architectural Geometry -->
  <g opacity="0.85">
    <line x1="80" y1="80" x2="1120" y2="80" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="80" y1="720" x2="1120" y2="720" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="80" y1="80" x2="80" y2="720" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="1120" y1="80" x2="1120" y2="720" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

    <!-- Central Constructive Shapes -->
    <rect x="240" y="160" width="720" height="480" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="240" y1="160" x2="960" y2="640" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="240" y1="640" x2="960" y2="160" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="600" cy="400" r="160" fill="none" stroke="#E63946" stroke-width="1.5" stroke-dasharray="4 6"/>
    <rect x="440" y="260" width="320" height="280" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  </g>

  <!-- Monospace & Grotesque Typography -->
  <text x="110" y="125" fill="#E63946" font-family="ui-monospace, monospace" font-size="14" letter-spacing="3" font-weight="600">EXHIBITION 05</text>
  <text x="110" y="660" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="36" font-weight="700" letter-spacing="-1">FACADE GRID</text>
  <text x="110" y="692" fill="rgba(255,255,255,0.5)" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2">MODULAR ANODIZED LOUVERS // OSLO</text>

  <!-- Viewfinder Marks -->
  <path d="M 600 360 L 600 440 M 560 400 L 640 400" stroke="#E63946" stroke-width="1"/>
  <text x="1090" y="125" fill="rgba(255,255,255,0.3)" font-family="ui-monospace, monospace" font-size="12" text-anchor="end">4:3 // 1200×800</text>
  <text x="1090" y="692" fill="rgba(255,255,255,0.3)" font-family="ui-monospace, monospace" font-size="12" text-anchor="end">ISO 100 · 35MM</text>
</svg>