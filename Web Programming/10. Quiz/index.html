<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Web Fundamentals Quiz</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=DM+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --paper: #f1eee7;
      --ink: #16150f;
      --mute: #6d6a5f;
      --rule: #c9c4b6;
      --accent: #b3331d;
      --ok: #2f5d3a;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --paper: #14130f;
        --ink: #ebe7da;
        --mute: #9a9585;
        --rule: #3a372e;
        --accent: #e0654d;
        --ok: #7fb48a;
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --paper: #14130f;
      --ink: #ebe7da;
      --mute: #9a9585;
      --rule: #3a372e;
      --accent: #e0654d;
      --ok: #7fb48a;
      color-scheme: dark
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Newsreader", Georgia, "Times New Roman", serif;
      font-size: 19px;
      line-height: 1.5
    }

    .mono {
      font-family: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
      font-size: 13px;
      letter-spacing: .04em;
      text-transform: uppercase
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 56px 24px 96px
    }

    header {
      border-top: 3px solid var(--ink);
      padding-top: 14px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--mute)
    }

    h1 {
      font-weight: 400;
      font-size: clamp(38px, 8vw, 64px);
      line-height: 1.04;
      margin: 48px 0 16px;
      letter-spacing: -.01em
    }

    .lede {
      color: var(--mute);
      margin: 0 0 56px;
      max-width: 46ch
    }

    .q {
      border-top: 1px solid var(--rule);
      padding: 28px 0 8px
    }

    .q h2 {
      font-weight: 600;
      font-size: 21px;
      line-height: 1.35;
      margin: 0 0 18px;
      display: grid;
      grid-template-columns: 44px 1fr
    }

    .q h2 .mono {
      color: var(--mute);
      padding-top: 5px
    }

    .opts {
      margin: 0 0 20px 44px;
      padding: 0;
      border: 0
    }

    .opt {
      display: grid;
      grid-template-columns: 32px 1fr;
      padding: 9px 0;
      cursor: pointer;
      border-bottom: 1px solid transparent
    }

    .opt input {
      position: absolute;
      opacity: 0;
      pointer-events: none
    }

    .opt .k {
      font-family: "DM Mono", monospace;
      font-size: 13px;
      color: var(--mute);
      padding-top: 5px
    }

    .opt span.t {
      border-bottom: 1px solid transparent
    }

    .opt:hover span.t {
      border-bottom-color: var(--mute)
    }

    .opt input:checked~.t {
      border-bottom: 2px solid var(--ink);
      font-weight: 600
    }

    .opt input:checked~.k {
      color: var(--ink)
    }

    .opt input:focus-visible~.t {
      outline: 2px solid var(--accent);
      outline-offset: 3px
    }

    .bar {
      position: sticky;
      bottom: 0;
      background: var(--paper);
      border-top: 3px solid var(--ink);
      padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px));
      margin-top: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px
    }

    button {
      font-family: "DM Mono", ui-monospace, monospace;
      font-size: 13px;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: var(--ink);
      color: var(--paper);
      border: 0;
      border-radius: 0;
      padding: 14px 26px;
      cursor: pointer
    }

    button:hover {
      background: var(--accent);
      color: #fff
    }

    button:disabled {
      background: transparent;
      color: var(--mute);
      border: 1px solid var(--rule);
      cursor: not-allowed
    }

    button.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--ink)
    }

    button.ghost:hover {
      background: var(--ink);
      color: var(--paper)
    }

    .msg {
      color: var(--accent);
      min-height: 1.4em
    }

    .score {
      display: flex;
      align-items: baseline;
      gap: 18px;
      border-top: 3px solid var(--ink);
      padding-top: 24px;
      margin-top: 40px
    }

    .score .n {
      font-size: clamp(96px, 24vw, 168px);
      line-height: .9;
      font-weight: 400;
      letter-spacing: -.03em
    }

    .score .d {
      font-size: clamp(28px, 6vw, 44px);
      color: var(--mute)
    }

    .verdict {
      font-size: 24px;
      margin: 8px 0 8px
    }

    .tally {
      display: flex;
      gap: 32px;
      color: var(--mute);
      margin: 20px 0 48px;
      flex-wrap: wrap
    }

    .tally b {
      color: var(--ink);
      font-weight: 500
    }

    .r {
      border-top: 1px solid var(--rule);
      padding: 22px 0
    }

    .r .head {
      display: grid;
      grid-template-columns: 44px 1fr;
      margin-bottom: 8px
    }

    .r .head p {
      margin: 0;
      font-weight: 600
    }

    .r .row {
      margin-left: 44px;
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 4px 12px;
      padding: 3px 0
    }

    .r .row .mono {
      color: var(--mute);
      padding-top: 4px
    }

    .good {
      color: var(--ok)
    }

    .bad {
      color: var(--accent)
    }

    .bad .t {
      text-decoration: line-through;
      text-decoration-thickness: 1px
    }

    .note {
      margin: 10px 0 0 44px;
      color: var(--mute);
      font-size: 17px
    }

    .hide {
      display: none
    }

    @media (max-width:520px) {
      body {
        font-size: 18px
      }

      .opts,
      .note,
      .r .row {
        margin-left: 0
      }

      .q h2,
      .r .head {
        grid-template-columns: 34px 1fr
      }

      .r .row {
        grid-template-columns: 1fr
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="mono"><span>Lab Programme 10</span><span>Web Fundamentals</span></header>
    <h1>Ten questions on the web’s plain materials.</h1>
    <p class="lede">Choose one answer for each question, then submit. Your score and a question-by-question review
      follow.</p>

    <section id="quiz">
      <form id="form" novalidate></form>
      <div class="bar">
        <span class="mono" id="count">0 / 10 answered</span>
        <span class="msg mono" id="msg" role="status"></span>
        <button id="submit" type="button">Submit</button>
      </div>
    </section>

    <section id="result" class="hide" aria-live="polite"></section>
  </main>

  <script>
    const QUESTIONS = [
      { q: "Which HTML element holds the primary navigation links of a page?", o: ["<menu>", "<nav>", "<aside>", "<links>"], a: 1, n: "<nav> is the semantic landmark for major navigation blocks." },
      { q: "Which CSS property makes a container a flex container?", o: ["flex: 1", "align-items: center", "display: flex", "position: flex"], a: 2, n: "Flexbox begins with display: flex on the parent." },
      { q: "What does the CSS rule @media (max-width: 600px) target?", o: ["Screens at least 600px wide", "Screens 600px wide or narrower", "Only printers", "Only 600px-tall screens"], a: 1, n: "max-width applies the rules up to and including that width." },
      { q: "Which keyword declares a variable that cannot be reassigned in JavaScript?", o: ["var", "let", "const", "static"], a: 2, n: "const prevents reassignment of the binding." },
      { q: "What does document.querySelector('.item') return?", o: ["Every element with class item", "The first matching element, or null", "An array of strings", "The class name"], a: 1, n: "querySelectorAll returns all matches; querySelector returns the first." },
      { q: "Which method adds an element to the end of an array?", o: ["push()", "pop()", "shift()", "concat()"], a: 0, n: "push() appends and returns the new length." },
      { q: "What does the expression typeof null evaluate to?", o: ["\"null\"", "\"undefined\"", "\"object\"", "\"number\""], a: 2, n: "A long-standing quirk of the language." },
      { q: "Which function runs code repeatedly at a fixed interval?", o: ["setTimeout()", "setInterval()", "requestIdle()", "repeat()"], a: 1, n: "setInterval repeats until clearInterval is called." },
      { q: "Which operator compares both value and type?", o: ["==", "=", "===", "=>"], a: 2, n: "=== performs strict equality without type coercion." },
      { q: "Which HTTP status code means the resource was not found?", o: ["200", "301", "403", "404"], a: 3, n: "404 Not Found; 403 is forbidden, 301 a permanent redirect." }
    ];
    const L = ["A", "B", "C", "D"];
    const form = document.getElementById("form");
    const count = document.getElementById("count");
    const msg = document.getElementById("msg");
    const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const pad = n => String(n).padStart(2, "0");

    function render() {
      form.innerHTML = QUESTIONS.map((x, i) => `
    <fieldset class="q" style="border-left:0;border-right:0;border-bottom:0;margin:0;padding-inline:0;min-inline-size:0">
      <legend class="hide">Question ${i + 1}</legend>
      <h2><span class="mono">${pad(i + 1)}</span><span>${esc(x.q)}</span></h2>
      <div class="opts">${x.o.map((t, j) => `
        <label class="opt"><input type="radio" name="q${i}" value="${j}"><span class="k">${L[j]}</span><span class="t">${esc(t)}</span></label>`).join("")}
      </div>
    </fieldset>`).join("");
      update();
    }
    function answers() {
      return QUESTIONS.map((_, i) => { const c = form.querySelector(`input[name=q${i}]:checked`); return c ? +c.value : null });
    }
    function update() {
      const n = answers().filter(v => v !== null).length;
      count.textContent = `${n} / ${QUESTIONS.length} answered`;
      if (n === QUESTIONS.length) msg.textContent = "";
    }
    form.addEventListener("change", update);

    document.getElementById("submit").addEventListener("click", () => {
      const ans = answers();
      const first = ans.indexOf(null);
      if (first !== -1) {
        const left = ans.filter(v => v === null).length;
        msg.textContent = `${left} unanswered`;
        form.querySelectorAll(".q")[first].scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
      showResult(ans);
    });

    function showResult(ans) {
      const total = QUESTIONS.length;
      const score = ans.reduce((s, v, i) => s + (v === QUESTIONS[i].a ? 1 : 0), 0);
      const pct = Math.round(score / total * 100);
      const verdict = pct === 100 ? "Flawless." : pct >= 80 ? "Strong result." : pct >= 60 ? "A solid pass." : pct >= 40 ? "Needs revision." : "Start from the basics again.";
      const review = QUESTIONS.map((x, i) => {
        const ok = ans[i] === x.a;
        return `<div class="r">
      <div class="head"><span class="mono ${ok ? "good" : "bad"}">${pad(i + 1)}</span><p>${esc(x.q)}</p></div>
      <div class="row ${ok ? "good" : "bad"}"><span class="mono">${ok ? "Correct" : "Your answer"}</span><span class="t">${L[ans[i]]}. ${esc(x.o[ans[i]])}</span></div>
      ${ok ? "" : `<div class="row good"><span class="mono">Correct answer</span><span>${L[x.a]}. ${esc(x.o[x.a])}</span></div>`}
      <p class="note">${esc(x.n)}</p>
    </div>`}).join("");
      const res = document.getElementById("result");
      res.innerHTML = `
    <div class="mono" style="color:var(--mute);margin-top:40px">Result</div>
    <div class="score"><span class="n">${score}</span><span class="d">/ ${total}</span></div>
    <p class="verdict">${verdict}</p>
    <div class="tally mono"><span>Correct <b>${score}</b></span><span>Incorrect <b>${total - score}</b></span><span>Score <b>${pct}%</b></span></div>
    ${review}
    <div class="bar" style="position:static"><span></span><button id="retry" type="button" class="ghost">Retake quiz</button></div>`;
      document.getElementById("quiz").classList.add("hide");
      res.classList.remove("hide");
      window.scrollTo({ top: 0 });
      document.getElementById("retry").onclick = () => {
        res.classList.add("hide"); document.getElementById("quiz").classList.remove("hide");
        msg.textContent = ""; render(); window.scrollTo({ top: 0 });
      };
    }
    render();
  </script>
</body>

</html>
